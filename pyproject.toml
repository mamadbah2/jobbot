[project]
name = "jobbot"
version = "0.1.0"
description = "JobBot Sénégal — candidature assistée pour le marché de l'emploi sénégalais."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "apscheduler>=3.10",
    "pydantic-settings>=2.5",
    "structlog>=24.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "phonenumbers>=8.13",
    "email-validator>=2.2",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: nécessite Postgres et Redis réels ; activé par RUN_INTEGRATION_TESTS=1",
]
addopts = "-m 'not integration'"
filterwarnings = [
    # Avertissements internes à starlette.testclient (tâche 11), déclenchés dès
    # l'import de `fastapi.testclient.TestClient` — code du brief, pas le nôtre.
    # Corriger imposerait soit `httpx2` (dépendance non justifiée, §3), soit un
    # downgrade de fastapi/starlette (hors périmètre). Portée volontairement
    # étroite : seuls ces deux messages précis sont ignorés.
    "ignore:Using .httpx. with .starlette\\.testclient. is deprecated.*httpx2.*:UserWarning",
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
