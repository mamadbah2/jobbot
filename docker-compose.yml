name: jobbot

x-app: &app
  build:
    context: .
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

x-depends-app: &depends_app
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    # Exposé UNIQUEMENT sur la boucle locale, pour les clients graphiques de dev.
    # Ne jamais reproduire tel quel sur le VPS : en production, la base ne doit
    # être joignable que depuis le réseau interne de Compose.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Applique les migrations puis s'arrête. Les autres services l'attendent.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command: ["python", "-m", "src.api.main"]
    # Rabattu sur la boucle locale le 2026-09-13, quand `web` est devenu le
    # frontal : le navigateur ne parle plus jamais à l'API directement. Laisser
    # 0.0.0.0 permettrait de contourner Next et de se forger le
    # `X-Forwarded-For` de son choix, ce qui annulerait les plafonds par IP de
    # `core/auth/limites.py`. Le parcours curl du README continue de
    # fonctionner en local. Même politique que postgres ci-dessus.
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    depends_on: *depends_app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('HTTP_PORT','8080')+'/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Client Next.js — le seul client du produit depuis le 2026-09-12, et le
  # seul frontal HTTP depuis le 2026-09-13.
  web:
    build:
      context: ./web
    # Pas d'`env_file` ici, contrairement aux services Python : `web` ne reçoit
    # QUE ce qui est nommé ci-dessous. Un réglage documenté dans `.env.example`
    # mais absent de cette liste n'atteint jamais le process — c'est par ce
    # trou qu'est passée la confiance au proxy. `tests/test_compose.py` le
    # vérifie désormais, clé par clé.
    environment:
      API_BASE_URL: "http://api:${HTTP_PORT:-8080}"
      COOKIE_SESSION_NOM: "${COOKIE_SESSION_NOM:-jobbot_session}"
      ENVIRONMENT: "${ENVIRONMENT:-dev}"
      WEB_DERRIERE_PROXY: "${WEB_DERRIERE_PROXY:-false}"
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker_ingest:
    <<: *app
    command: ["python", "-m", "src.worker_ingest"]
    depends_on: *depends_app

  worker_match:
    <<: *app
    command: ["python", "-m", "src.worker_match"]
    depends_on: *depends_app

volumes:
  pgdata:
  redisdata:
