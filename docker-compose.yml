name: jobbot

x-app: &app
  build:
    context: .
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

x-depends-app: &depends_app
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    # Exposé UNIQUEMENT sur la boucle locale, pour les clients graphiques de dev.
    # Ne jamais reproduire tel quel sur le VPS : en production, la base ne doit
    # être joignable que depuis le réseau interne de Compose.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Applique les migrations puis s'arrête. Les autres services l'attendent.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command: ["python", "-m", "src.api.main"]
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    depends_on: *depends_app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('HTTP_PORT','8080')+'/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Client Next.js. L'image est construite par le plan « client web » ;
  # `web/Dockerfile` n'existe pas encore, donc ce service ne démarre pas tant
  # que ce plan n'est pas exécuté. Déclaré ici pour que l'architecture du §4
  # soit lisible dans un seul fichier.
  web:
    build:
      context: ./web
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["web"]

  worker_ingest:
    <<: *app
    command: ["python", "-m", "src.worker_ingest"]
    depends_on: *depends_app

  worker_match:
    <<: *app
    command: ["python", "-m", "src.worker_match"]
    depends_on: *depends_app

volumes:
  pgdata:
  redisdata:
